:root { --gold: #c9a462; --gold2: #f3d9a0; --steel: #e9eae6; --ink: #111214; --red: #cc2744; }

.title { font-weight: 800; font-stretch: 112%; text-transform: uppercase; letter-spacing: -.025em; line-height: .9; }

.logo i { display: inline-block; width: 8px; height: 8px; background: var(--red); margin: 0 3px; }

.glint { width: 70px; height: 70px; mix-blend-mode: screen; z-index: 30; }
.glint::before, .glint::after { content: ""; position: absolute; left: 50%; top: 50%; background: radial-gradient(closest-side, #fff, rgba(255,240,210,.6) 30%, transparent); }

const SCENES = {
