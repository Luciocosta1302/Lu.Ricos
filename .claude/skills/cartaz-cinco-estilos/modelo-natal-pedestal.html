<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<script src="file:///home/user/aurea-estetica/assets/data.js"></script>
<script src="file:///home/user/aurea-estetica/assets/natal.js"></script>
<style>
/* Anúncio de Natal no estilo das artes de campanha da LU.RICOS:
   cena escura com profundidade (luz, bokeh, glitter), logo no topo com fios dourados, título em serifa clássica,
   subtítulo em itálico, fio dourado, o relógio real em pé num pedestal e enfeites em foto ao redor. */
html, body { margin: 0; }
.p { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--txt); }
.p > * { position: absolute; }
.bg { inset: 0; background: var(--bg); }
.tex { inset: 0; background: url(file:///home/user/aurea-estetica/assets/img/natal/texturas/glitter.webp) 0 0 / 260px auto repeat; mix-blend-mode: overlay; opacity: var(--glit, .55); }
.vig { inset: 0; background: radial-gradient(75% 60% at 50% 45%, transparent 45%, rgba(0,0,0,.45) 100%); }
.bokeh { inset: 0; }
.bokeh i { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,150,.95), rgba(255,170,90,.35) 45%, transparent 70%); filter: blur(2px); }
.logo { left: 0; right: 0; top: 62px; display: flex; justify-content: center; align-items: center; gap: 34px; z-index: 6; }
.logo.left { justify-content: flex-start; left: 76px; }
.logo b { font: 800 52px Archivo; font-stretch: 125%; letter-spacing: -.01em; color: var(--logo, #fff); }
.logo b i { display: inline-block; width: .17em; height: .17em; background: #d0243b; margin: 0 .06em; }
.logo span { width: 130px; height: 1.5px; background: linear-gradient(90deg, transparent, #c9a462 30%, #c9a462 70%, transparent); }
.copy { z-index: 6; }
.copy h1 { margin: 0; font: 600 var(--fs, 112px)/.95 "Cormorant Garamond"; letter-spacing: -.005em; text-transform: uppercase; color: var(--title); }
.copy h1 em { font-style: normal; color: var(--accent, var(--title)); }
.copy p { margin: 18px 0 0; font: italic 500 46px/1.15 "Cormorant Garamond"; color: var(--sub); }
.copy hr { width: 140px; margin: 34px 0 0; border: 0; height: 2px; background: #c9a462; }
.copy.center { left: 0; right: 0; text-align: center; } .copy.center hr { margin-inline: auto; }
.copy.left { left: 76px; width: 940px; }
.watch { z-index: 4; filter: drop-shadow(18px 26px 22px rgba(0,0,0,.5)) drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.watch img { display: block; width: 100%; }
.ped { z-index: 3; }
.ped svg { display: block; width: 100%; height: auto; overflow: visible; }
.el { z-index: 2; } .el img { display: block; width: 100%; height: auto; }
.el.front { z-index: 5; }
.shadow { filter: drop-shadow(0 24px 30px rgba(0,0,0,.45)); }
.pine { z-index: 5; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
.pine svg { width: 100%; height: auto; display: block; }
.blur { filter: blur(5px) brightness(.8); }
</style>
<body>
<script>
const Q = new URLSearchParams(location.search), W = Q.get('w') || 'riviera';
const E = 'file:///home/user/aurea-estetica/assets/img/natal/elementos/', R = 'file:///home/user/aurea-estetica/brand/recortes-png/';
const K = LR.Natal.kit;
// pedestal: cilindro (vermelho veludo ou pedra clara)
const ped = (tone) => {
  const c = tone === 'stone' ? ['#efe4d2', '#d8c7ad', '#a8916e', '#f6ede0'] : ['#c51d32', '#8c101d', '#4a0912', '#d93348'];
  return `<svg viewBox="0 0 400 230"><defs><linearGradient id="pf" x1="0" x2="1"><stop offset="0" stop-color="${c[2]}"/><stop offset=".3" stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient>
  <radialGradient id="pt" cx="42%" cy="40%" r="70%"><stop offset="0" stop-color="${c[3]}"/><stop offset="1" stop-color="${c[1]}"/></radialGradient></defs>
  <ellipse cx="200" cy="222" rx="210" ry="22" fill="#000" opacity=".35" filter="blur(6px)"/>
  <path d="M10 40 V200 A190 28 0 0 0 390 200 V40 Z" fill="url(#pf)"/><ellipse cx="200" cy="40" rx="190" ry="30" fill="url(#pt)"/>
  <path d="M10 40 A190 30 0 0 1 390 40" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/></svg>`;
};
const bokeh = (n, seed, area) => { let s = seed; const r = () => (s = s * 16807 % 2147483647) / 2147483647; let h = '';
  for (let i = 0; i < n; i++) { const d = 8 + r() * 46, x = area[0] + r() * (area[2] - area[0]), y = area[1] + r() * (area[3] - area[1]);
    h += `<i style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;opacity:${(.25 + r() * .6).toFixed(2)}"></i>`; } return h; };
const A = {
  riviera:   { bg: 'radial-gradient(80% 60% at 60% 35%, #8c1220 0%, #5a0a14 45%, #24050a 100%)', title: '#f3e6cf', sub: '#efe2cb', t: 'Tempo de<br>presentear.', s: 'Ouro e azul para marcar o Natal.', layout: 'left', img: 'riviera.png', bottom: 1160, ww: 420, cx: 640, ped: 'red', deco: 'caixas-esq' },
  colmeia:   { bg: 'radial-gradient(80% 60% at 50% 30%, #a3172a 0%, #6a0d18 50%, #2a050b 100%)', title: '#f6ead6', sub: '#f3e6d2', t: 'Um presente<br>para marcar.', s: 'Mostrador colmeia, aço e data.', layout: 'center', img: 'colmeia.png', ww: 290, cx: 540, ped: 'stone', deco: 'saco-esq', bottom: 1160, fs: 104 },
  esmeralda: { bg: 'radial-gradient(80% 60% at 45% 35%, #1f4a3a 0%, #12302a 50%, #071612 100%)', title: '#f3ead8', sub: '#efe5d0', accent: '#d6b26a', t: 'Um toque de<br><em>verde.</em>', s: 'Verde solar, com dia e data.', layout: 'left', img: 'esmeralda.png', bottom: 1160, ww: 365, cx: 650, ped: 'red', deco: 'caixas-esq', glit: .35 },
  rosa:      { bg: 'radial-gradient(80% 60% at 55% 40%, #24372c 0%, #142219 55%, #08100b 100%)', title: '#f3e9d6', sub: '#efe4cf', t: 'Clássico e<br>atemporal.', s: 'Couro caramelo e mostrador branco.', layout: 'left', img: 'rosa-dos-ventos.png', bottom: 1160, ww: 218, cx: 660, ped: 'red', deco: 'saco-esq', glit: .35 },
  romano:    { bg: 'radial-gradient(80% 60% at 40% 30%, #fbf3e6 0%, #efe3cf 55%, #d9c7aa 100%)', title: '#5a0f19', sub: '#3b2a22', t: 'Presença em<br>cada detalhe.', s: 'Números romanos e couro preto.', layout: 'left', img: 'romano.png', ww: 480, cx: 640, ped: 'red', deco: 'caixas-esq', logo: '#5a0f19', glit: .25, light: true, fs: 100, bottom: 1160 },
  sunlifex:  { bg: 'radial-gradient(80% 60% at 50% 30%, #95141f 0%, #600b16 50%, #26050a 100%)', title: '#f6ead6', sub: '#f3e6d2', t: 'Três visores,<br>um presente.', s: 'Cronógrafo de aço, fundo prata.', layout: 'center', img: 'sunlifex.png', ww: 400, cx: 540, ped: 'stone', deco: 'caixas-esq', bottom: 1160, fs: 104 },
}[W];
const deco = {
  'caixas-dir': `<div class="el shadow" style="right:-60px;top:760px;width:470px">${'<img src="' + E + 'caixas.webp">'}</div>`,
  'caixas-esq': `<div class="el shadow" style="left:-80px;top:${(A.bottom||1100)-330}px;width:420px"><img src="${E}caixas.webp"></div>`,
  'saco-esq':   `<div class="el shadow" style="left:-70px;top:${(A.bottom||1100)-470}px;width:360px"><img src="${E}saco.webp"></div>`,
  'saco-dir':   `<div class="el shadow" style="right:-50px;top:690px;width:380px"><img src="${E}saco.webp"></div>`,
}[A.deco];
A.wl = A.cx - A.ww / 2;
const wBottom = A.bottom || 1100, pedW = A.ww * 1.1 + 110, pedL = A.cx - pedW / 2, sc = pedW / 400, pedTop = wBottom - 10 - 40 * sc;
document.body.innerHTML = `<div class="p" style="--bg:${A.bg};--title:${A.title};--sub:${A.sub};--accent:${A.accent || A.title};--logo:${A.logo || '#fff'};--glit:${A.glit ?? .55}">
  <div class="bg"></div><div class="tex"></div>
  <div class="bokeh">${bokeh(A.light ? 10 : 26, 7 + A.ww, [0, 380, 1080, 1100])}</div>
  <div class="vig" style="${A.light ? 'opacity:.35' : ''}"></div>
  <div class="pine blur" style="right:-120px;top:-40px;width:520px;transform:rotate(160deg)">${K.pine(11, 360)}</div>
  <div class="pine" style="right:-60px;top:-70px;width:440px;transform:rotate(150deg)">${K.pine(23, 340)}</div>
  <div class="el shadow front" style="right:${A.layout === 'center' ? 40 : 70}px;top:-60px;width:${A.layout === 'center' ? 120 : 160}px"><img src="${E}bolas.webp"></div>
  <div class="pine" style="right:-90px;bottom:110px;width:420px;transform:scaleX(-1) rotate(-12deg)">${K.pine(5, 320)}</div>
  ${deco}
  <div class="ped" style="left:${pedL}px;top:${pedTop}px;width:${pedW}px">${ped(A.ped)}</div>
  <div class="el" style="z-index:3;left:${A.cx - A.ww * .45}px;top:${wBottom - 18}px;width:${A.ww * .9}px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)"></div>
  <div class="el" style="z-index:3;left:${A.cx - A.ww * 1.1}px;top:${wBottom - A.ww * 2.2}px;width:${A.ww * 2.2}px;height:${A.ww * 2.2}px;border-radius:50%;background:radial-gradient(closest-side,${A.light ? 'rgba(255,255,255,.7)' : 'rgba(255,190,120,.30)'},transparent);pointer-events:none"></div>
  <div class="watch" style="left:${A.wl}px;width:${A.ww}px;bottom:${1350 - wBottom}px"><img src="${R}${A.img}"></div>
  <div class="el front" style="right:40px;bottom:-40px;width:170px;transform:rotate(8deg)"><img src="${E}bola-a.webp" style="filter:drop-shadow(0 18px 18px rgba(0,0,0,.5))"></div>
  <div class="logo ${A.layout === 'left' ? 'left' : ''}">${A.layout === 'left' ? '' : '<span></span>'}<b>LU<i></i>RICOS</b><span></span></div>
  <div class="copy ${A.layout}" style="top:160px;--fs:${A.fs || 112}px"><h1>${A.t}</h1><p>${A.s}</p><hr></div>
</div>`;
</script>
