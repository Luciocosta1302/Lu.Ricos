<body data-page="loja">

<div class="preloader" aria-hidden="true">
  <div class="preloader-top"><span>LU.RICOS</span><span>Carregando</span></div>
  <div class="preloader-count">0</div>
  <div class="preloader-bar"><i></i></div>
</div>
<div class="transition" aria-hidden="true"><span class="transition-label">LU.RICOS</span></div>

<div id="site-header"></div>

<main id="conteudo">

  <section class="page-head wrap">
    <div class="crumbs"><a class="label" href="index.html">Início</a><span class="label">/</span><span class="label label-ink">Loja</span></div>
    <div class="page-head-row">
      <h1 class="display display-xl split">Loja</h1>
      <span class="label num count" data-count>— peças</span>
    </div>
  </section>
  <section class="wrap">
    <div class="toolbar">
      <div class="chips" data-chips></div>
      <div class="toolbar-right">
        <button class="chip is-active" type="button" data-col-filter hidden></button>
        <div class="select"><label class="sr-only" for="sort">Ordenar</label><select id="sort" data-sort><option value="padrao">Ordenar: padrão</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="nome">Nome A–Z</option></select></div>
        <div class="view-toggle"><button type="button" class="is-active" data-view="4" aria-label="4 colunas">IIII</button> <button type="button" data-view="3" aria-label="3 colunas">III</button></div>
      </div>
    </div>
    <div class="products" data-grid="loja" style="margin-top:1px"></div>
    <p class="empty" data-empty hidden>Nenhuma peça nesta combinação.</p>
  </section>

  <section class="section wrap">
    <div class="newsletter">
      <h2 class="display display-l split">Novidades,<br>sem spam.</h2>
      <form data-newsletter novalidate>
        <p class="label" style="margin-bottom:1rem" data-reveal>Um e-mail por lançamento. Só isso.</p>
        <div class="field" data-reveal><label for="nl-email">Seu e-mail</label><input id="nl-email" type="email" name="email" required autocomplete="email"><button type="submit">Inscrever →</button></div>
        <p class="form-msg" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
