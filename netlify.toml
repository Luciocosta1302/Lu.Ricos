[build]
  command = "npm run build"
  publish = "_site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # O assistente lê o MESMO catálogo do site
  included_files = ["assets/data.js"]

# Endereços antigos dos relógios e artigos levam às páginas próprias (melhor para o Google)
[[redirects]]
  from = "/produto.html"
  to = "/relogio-:id.html"
  status = 301
  force = true
  query = {id = ":id"}

[[redirects]]
  from = "/artigo.html"
  to = "/artigo-:slug.html"
  status = 301
  force = true
  query = {slug = ":slug"}

# Cache: fotos e fontes podem ficar guardadas no aparelho; CSS/JS revalidam rápido (os nomes não mudam a cada versão)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=604800"
